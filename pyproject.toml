[project.scripts]
fly-train = "train:main"
fly-benchmark = "benchmark:main"

[build-system]
requires = ["hatchling>=1.11.0"]
build-backend = "hatchling.build"

[project]
requires-python = ">=3.10,<3.13"
version = "0.0.1"

name        = "four-leaf-yolo"
description = "Training YOLO to detect four leaf clovers."
readme      = ".github/README.md"
license     = "MIT"

dependencies = [
  "ultralytics",
  "onnx>=1.12.0",
  "onnxslim",
  "onnxruntime-gpu",
  "tensorrt-cu12",

  # Annotations
  "label-studio",
]

[project.optional-dependencies]
paddle = [
  "paddlepaddle-gpu",
  "x2paddle",
]
tensorflow = [
  "tensorflow==2.10.*",  # last version with native Windows GPU
]

[tool.hatch.build]
ignore-vcs = false
reproducible = true
directory = "dist"
sources = ["src"]
include = ["src/", "LICENSE", "pyproject.toml", ".github/README.md"]