  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      /* Clean dark gradient - professional and minimal */
      background: linear-gradient(135deg, #1a1a1a 0%, #2d4a2d 50%, #1a1a1a 100%);
      color-scheme: dark;
    }

    #app {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Video and Canvas Container */
    #video-container {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }

    #webcam {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
    }

    #canvas {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    /* Glassmorphism UI Elements */
    .glass {
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
    }

    /* Stats Overlay */
    #stats {
      position: absolute;
      top: env(safe-area-inset-top, 16px);
      left: env(safe-area-inset-left, 16px);
      padding: 8px 16px;
      border-radius: 24px;
      font-size: 13px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.95);
      z-index: 20;
      display: none;
    }

    /* Bottom Control Bar */
    #controls-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 16px 16px 16px 16px;
      background: linear-gradient(to top, rgba(0, 0, 0, 0.85), rgba(0, 0, 0, 0.4) 70%, transparent);
      display: none;
      align-items: center;
      justify-content: center;
      gap: 12px;
      z-index: 20;
    }

    /* iOS safe area support - only apply env() on supporting browsers */
    @supports (padding: env(safe-area-inset-bottom)) {
      #controls-bar {
        bottom: env(safe-area-inset-bottom, 0);
        padding: 16px env(safe-area-inset-right, 16px) calc(16px + env(safe-area-inset-bottom, 0)) env(safe-area-inset-left, 16px);
      }
    }

    /* Switch Camera Button */
    #switch-camera {
      width: 52px;
      height: 52px;
      min-width: 52px;
      border-radius: 50%;
      font-size: 22px;
      border: none;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1.5px solid rgba(255, 255, 255, 0.25);
      color: white;
      flex-shrink: 0;
    }

    #switch-camera:active {
      transform: scale(0.92);
      background: rgba(255, 255, 255, 0.25);
    }

    /* Filter Toggle */
    #filter-toggle {
      flex: 1;
      max-width: 280px;
      padding: 14px 24px;
      border-radius: 28px;
      font-size: 15px;
      font-weight: 600;
      color: white;
      border: none;
      cursor: pointer;
      transition: all 0.2s ease;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
      white-space: nowrap;
    }

    #filter-toggle.mode-all {
      background: rgba(72, 249, 10, 0.25);
      border: 2px solid rgba(72, 249, 10, 0.7);
      box-shadow: 0 0 16px rgba(72, 249, 10, 0.3);
    }

    #filter-toggle.mode-four-leaf {
      background: rgba(255, 178, 29, 0.25);
      border: 2px solid rgba(255, 178, 29, 0.7);
      box-shadow: 0 0 16px rgba(255, 178, 29, 0.3);
    }

    #filter-toggle:active {
      transform: scale(0.96);
    }

    /* Start Button */
    #start-button {
      padding: 18px 48px;
      border-radius: 32px;
      font-size: 18px;
      font-weight: 700;
      color: white;
      border: none;
      cursor: pointer;
      transition: all 0.2s ease;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
      background: rgba(72, 249, 10, 0.3);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 2px solid rgba(72, 249, 10, 0.6);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3), 0 0 20px rgba(72, 249, 10, 0.2);
    }

    #start-button:active:not(:disabled) {
      transform: scale(0.95);
    }

    #start-button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* Loading Overlay */
    #loading {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.9);
      z-index: 100;
      color: white;
    }

    .spinner {
      width: 48px;
      height: 48px;
      border: 3px solid rgba(255, 255, 255, 0.2);
      border-top-color: #48F90A;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 20px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    #loading-text {
      font-size: 17px;
      font-weight: 600;
      margin-bottom: 10px;
    }

    #loading-progress {
      font-size: 14px;
      opacity: 0.7;
    }

    /* Hidden class */
    .hidden {
      display: none !important;
    }

    /* Mobile optimizations */
    @media (max-width: 768px) {
      #stats {
        font-size: 11px;
        padding: 6px 12px;
        top: env(safe-area-inset-top, 12px);
        left: env(safe-area-inset-left, 12px);
      }

      #controls-bar {
        position: fixed !important;
        bottom: 0 !important;
        padding: 12px 12px 12px 12px !important;
        gap: 10px;
        display: none !important;
        flex-direction: row !important;
        align-items: center !important;
        justify-content: center !important;
      }

      /* iOS safe area support for mobile */
      @supports (padding: env(safe-area-inset-bottom)) {
        #controls-bar {
          padding: 12px env(safe-area-inset-right, 12px) calc(12px + env(safe-area-inset-bottom, 0)) env(safe-area-inset-left, 12px) !important;
        }
      }

      #switch-camera {
        width: 48px;
        height: 48px;
        min-width: 48px;
        font-size: 20px;
      }

      #filter-toggle {
        padding: 12px 20px;
        font-size: 14px;
        max-width: 240px;
      }

      #start-button {
        padding: 16px 40px;
        font-size: 17px;
      }
    }

    /* Small phones */
    @media (max-width: 380px) {
      #controls-bar {
        gap: 8px;
      }

      #filter-toggle {
        font-size: 13px;
        padding: 10px 16px;
        max-width: 200px;
      }

      #switch-camera {
        width: 44px;
        height: 44px;
        min-width: 44px;
        font-size: 18px;
      }
    }

    /* Debug mode - colored outlines for visual confirmation on mobile */
    body.mobile-debug #controls-bar {
      outline: 3px solid red !important;
      outline-offset: -3px;
    }

    body.mobile-debug #filter-toggle {
      outline: 3px solid yellow !important;
      outline-offset: -3px;
    }

    body.mobile-debug #switch-camera {
      outline: 3px solid cyan !important;
      outline-offset: -3px;
    }
  </style>

<body>
  <div id="app">
    <!-- Loading Overlay -->
    <div id="loading">
      <div class="spinner"></div>
      <div id="loading-text">Loading YOLOv8 Model...</div>
      <div id="loading-progress">0%</div>
    </div>

    <!-- Video Container -->
    <div id="video-container">
      <video id="webcam" autoplay playsinline muted></video>
      <canvas id="canvas"></canvas>
      
      <!-- Stats Overlay -->
      <div id="stats" class="glass">
        <span id="fps">0 FPS</span> | <span id="detections">0 detections</span>
      </div>

      <!-- Bottom Control Bar -->
      <div id="controls-bar">
        <button id="switch-camera">🔄</button>
        <button id="filter-toggle" class="mode-all">🍀 Show All Clovers</button>
      </div>

      <!-- Start Button -->
      <button id="start-button">🍀 Start Camera</button>
    </div>
  </div>

  <!-- TensorFlow.js -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.17.0"></script>

  <script type="module">
    // Constants
    const MODEL_PATH = './model/model.json';
    const INPUT_SIZE = 640;
    const CLASS_NAMES = ['Three-Leaf', 'Four-Leaf'];
    const COLORS = ['#48F90A', '#FFB21D']; // Green for 3-leaf, Gold for 4-leaf
    const NMS_IOU_THRESHOLD = 0.45;
    const NMS_SCORE_THRESHOLD = 0.3;
    const MAX_BOXES = 500;

    // ========== MOBILE DETECTION & OVERLAY SYSTEM ==========
    
    /**
     * Mobile device and feature detection utility
     */
    const MobileDetector = {
      isAndroid() {
        return /Android/i.test(navigator.userAgent);
      },
      
      isIOS() {
        return /iPhone|iPad|iPod/i.test(navigator.userAgent);
      },
      
      isMobile() {
        return this.isAndroid() || this.isIOS() || window.innerWidth <= 768;
      },
      
      supportsEnvVariables() {
        // Test if browser supports CSS env() variables
        const testDiv = document.createElement('div');
        testDiv.style.padding = 'env(safe-area-inset-bottom, 0px)';
        return testDiv.style.padding !== '';
      },
      
      getViewport() {
        return {
          width: window.innerWidth,
          height: window.innerHeight,
          orientation: window.innerWidth > window.innerHeight ? 'landscape' : 'portrait'
        };
      },
      
      log(message, ...args) {
        if (this.isMobile()) {
          console.log(`[MobileDetector] ${message}`, ...args);
        }
      }
    };

    /**
     * Mobile overlay manager - forces controls to be visible on Android
     */
    const MobileOverlay = {
      initialized: false,
      debugMode: false,
      
      init() {
        if (this.initialized) return;
        
        const isMobile = MobileDetector.isMobile();
        const isAndroid = MobileDetector.isAndroid();
        const viewport = MobileDetector.getViewport();
        
        console.log('[MobileOverlay] Initializing...', {
          isMobile,
          isAndroid,
          viewport,
          userAgent: navigator.userAgent
        });
        
        // Enable debug mode on mobile devices with ?debug=1 URL parameter
        const urlParams = new URLSearchParams(window.location.search);
        if (isMobile && urlParams.get('debug') === '1') {
          this.debugMode = true;
          document.body.classList.add('mobile-debug');
          console.log('[MobileOverlay] Debug mode enabled - controls have colored outlines');
          console.log('[MobileOverlay] To disable, remove ?debug=1 from URL');
        } else if (isMobile) {
          console.log('[MobileOverlay] Debug mode disabled. Add ?debug=1 to URL to enable colored outlines');
        }
        
        this.initialized = true;
      },
      
      forceControlsVisible() {
        const controlsBar = document.getElementById('controls-bar');
        const filterToggle = document.getElementById('filter-toggle');
        const switchCamera = document.getElementById('switch-camera');
        
        if (!controlsBar) {
          console.error('[MobileOverlay] controls-bar element not found!');
          return;
        }
        
        console.log('[MobileOverlay] Forcing controls visible...');
        
        // Force display to flex
        controlsBar.style.setProperty('display', 'flex', 'important');
        
        // Force positioning - use simple values for Android
        if (MobileDetector.isAndroid()) {
          console.log('[MobileOverlay] Applying Android-specific positioning');
          controlsBar.style.setProperty('position', 'fixed', 'important');
          controlsBar.style.setProperty('bottom', '0px', 'important');
          controlsBar.style.setProperty('left', '0px', 'important');
          controlsBar.style.setProperty('right', '0px', 'important');
          controlsBar.style.setProperty('padding', '12px', 'important');
        }
        
        // Force flexbox properties
        controlsBar.style.setProperty('flex-direction', 'row', 'important');
        controlsBar.style.setProperty('align-items', 'center', 'important');
        controlsBar.style.setProperty('justify-content', 'center', 'important');
        controlsBar.style.setProperty('gap', '10px', 'important');
        controlsBar.style.setProperty('z-index', '20', 'important');
        
        // Force layout recalculation
        void controlsBar.offsetHeight;
        
        // Get computed styles for debugging
        const computed = window.getComputedStyle(controlsBar);
        console.log('[MobileOverlay] Controls bar computed styles:', {
          display: computed.display,
          position: computed.position,
          bottom: computed.bottom,
          left: computed.left,
          right: computed.right,
          width: computed.width,
          height: computed.height,
          visibility: computed.visibility,
          opacity: computed.opacity,
          zIndex: computed.zIndex
        });
        
        // Check child elements
        if (filterToggle && switchCamera) {
          console.log('[MobileOverlay] Child elements found:', {
            filterToggle: {
              display: window.getComputedStyle(filterToggle).display,
              width: window.getComputedStyle(filterToggle).width
            },
            switchCamera: {
              display: window.getComputedStyle(switchCamera).display,
              width: window.getComputedStyle(switchCamera).width
            }
          });
        }
        
        console.log('[MobileOverlay] Force complete. Controls should now be visible.');
      },
      
      handleOrientationChange() {
        console.log('[MobileOverlay] Orientation changed:', MobileDetector.getViewport());
        // Re-apply forced visibility after orientation change
        if (MobileDetector.isMobile()) {
          setTimeout(() => this.forceControlsVisible(), 100);
        }
      },
      
      handleResize() {
        // Debounced resize handler
        if (this.resizeTimeout) clearTimeout(this.resizeTimeout);
        this.resizeTimeout = setTimeout(() => {
          console.log('[MobileOverlay] Resize detected:', MobileDetector.getViewport());
          if (MobileDetector.isMobile()) {
            this.forceControlsVisible();
          }
        }, 250);
      }
    };

    // Initialize mobile overlay system
    MobileOverlay.init();
    
    // ========== END MOBILE SYSTEM ==========

    // State
    let model = null;
    let webcamStream = null;
    let animationId = null;
    let filterMode = 'all'; // 'all' or 'four-leaf-only'
    let facingMode = 'environment'; // 'user' or 'environment'
    let isRunning = false;

    // Performance tracking
    let frameCount = 0;
    let lastTime = performance.now();
    let fps = 0;
    
    // Canvas size tracking for optimization
    let lastVideoWidth = 0;
    let lastVideoHeight = 0;

    // DOM Elements
    const elements = {
      loading: document.getElementById('loading'),
      loadingText: document.getElementById('loading-text'),
      loadingProgress: document.getElementById('loading-progress'),
      startButton: document.getElementById('start-button'),
      webcam: document.getElementById('webcam'),
      canvas: document.getElementById('canvas'),
      stats: document.getElementById('stats'),
      fpsDisplay: document.getElementById('fps'),
      detectionsDisplay: document.getElementById('detections'),
      filterToggle: document.getElementById('filter-toggle'),
      switchCamera: document.getElementById('switch-camera'),
      controlsBar: document.getElementById('controls-bar')
    };

    // Utility: Color palette for classes
    class Colors {
      constructor() {
        this.palette = COLORS;
      }
      
      get(i) {
        return this.palette[Math.floor(i) % this.palette.length];
      }
      
      static hexToRgba(hex, alpha) {
        const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
        return result
          ? `rgba(${parseInt(result[1], 16)}, ${parseInt(result[2], 16)}, ${parseInt(result[3], 16)}, ${alpha})`
          : null;
      }
    }

    const colors = new Colors();

    // Load Model
    async function loadModel() {
      try {
        elements.loadingText.textContent = 'Loading YOLOv8 Model...';
        elements.loadingProgress.textContent = '0%';
        
        model = await tf.loadGraphModel(MODEL_PATH, {
          onProgress: (fraction) => {
            const percent = Math.round(fraction * 100);
            elements.loadingProgress.textContent = `${percent}%`;
          }
        });

        elements.loadingText.textContent = 'Model Loaded!';
        elements.loadingProgress.textContent = '100%';
        
        // Warm up the model
        const dummyInput = tf.zeros([1, INPUT_SIZE, INPUT_SIZE, 3]);
        await model.executeAsync(dummyInput);
        tf.dispose(dummyInput);
        
        elements.loading.classList.add('hidden');
        console.log('Model loaded successfully');
      } catch (error) {
        console.error('Error loading model:', error);
        elements.loadingText.textContent = 'Error loading model';
        elements.loadingProgress.textContent = error.message;
      }
    }

    // Start Camera
    async function startCamera() {
      try {
        // Stop existing stream if any
        if (webcamStream) {
          webcamStream.getTracks().forEach(track => track.stop());
        }

        const constraints = {
          video: {
            facingMode: facingMode,
            width: { ideal: 1280 },
            height: { ideal: 720 }
          },
          audio: false
        };

        webcamStream = await navigator.mediaDevices.getUserMedia(constraints);
        elements.webcam.srcObject = webcamStream;
        
        // Wait for video to be ready
        await new Promise((resolve) => {
          elements.webcam.onloadedmetadata = () => {
            elements.webcam.play();
            resolve();
          };
        });

        // Show UI elements
        elements.startButton.classList.add('hidden');
        elements.stats.style.display = 'block';
        elements.controlsBar.style.display = 'flex';

        // Force controls visible on mobile devices
        if (MobileDetector.isMobile()) {
          console.log('[startCamera] Mobile device detected, forcing controls visible');
          MobileOverlay.forceControlsVisible();
        }

        // Start detection
        isRunning = true;
        detectFrame();
        
        console.log('Camera started');
      } catch (error) {
        console.error('Error accessing camera:', error);
        alert('Unable to access camera. Please grant camera permissions and try again.');
      }
    }

    // Switch Camera
    async function switchCamera() {
      facingMode = facingMode === 'user' ? 'environment' : 'user';
      await startCamera();
    }

    // Toggle Filter Mode
    function toggleFilter() {
      if (filterMode === 'all') {
        filterMode = 'four-leaf-only';
        elements.filterToggle.textContent = '✨ Four-Leaf Only';
        elements.filterToggle.classList.remove('mode-all');
        elements.filterToggle.classList.add('mode-four-leaf');
      } else {
        filterMode = 'all';
        elements.filterToggle.textContent = '🍀 Show All Clovers';
        elements.filterToggle.classList.remove('mode-four-leaf');
        elements.filterToggle.classList.add('mode-all');
      }
    }

    // Preprocess Image
    function preprocessImage(videoElement) {
      return tf.tidy(() => {
        const img = tf.browser.fromPixels(videoElement);
        
        // Pad to square
        const [h, w] = img.shape.slice(0, 2);
        const maxSize = Math.max(w, h);
        const imgPadded = img.pad([
          [0, maxSize - h],
          [0, maxSize - w],
          [0, 0]
        ]);

        // Resize and normalize
        const resized = tf.image.resizeBilinear(imgPadded, [INPUT_SIZE, INPUT_SIZE]);
        const normalized = resized.div(255.0);
        const batched = normalized.expandDims(0);
        
        return {
          input: batched,
          xRatio: maxSize / w,
          yRatio: maxSize / h
        };
      });
    }

    // Post-process Model Output
    async function postProcess(output) {
      return tf.tidy(() => {
        // Transpose: [1, 7, 8400] -> [1, 8400, 7]
        const transposed = output.transpose([0, 2, 1]);
        
        // Extract boxes [cx, cy, w, h] and convert to [y1, x1, y2, x2]
        const boxes = tf.tidy(() => {
          const w = transposed.slice([0, 0, 2], [-1, -1, 1]);
          const h = transposed.slice([0, 0, 3], [-1, -1, 1]);
          const cx = transposed.slice([0, 0, 0], [-1, -1, 1]);
          const cy = transposed.slice([0, 0, 1], [-1, -1, 1]);
          
          const x1 = tf.sub(cx, tf.div(w, 2));
          const y1 = tf.sub(cy, tf.div(h, 2));
          const x2 = tf.add(x1, w);
          const y2 = tf.add(y1, h);
          
          return tf.concat([y1, x1, y2, x2], 2).squeeze();
        });

        // Extract scores and classes
        const rawScores = transposed.slice([0, 0, 4], [-1, -1, CLASS_NAMES.length]).squeeze(0);
        const scores = rawScores.max(1);
        const classes = rawScores.argMax(1);

        return { boxes, scores, classes };
      });
    }

    // Apply NMS
    async function applyNMS(boxes, scores, classes) {
      const nmsIndices = await tf.image.nonMaxSuppressionAsync(
        boxes,
        scores,
        MAX_BOXES,
        NMS_IOU_THRESHOLD,
        NMS_SCORE_THRESHOLD
      );

      const selectedBoxes = boxes.gather(nmsIndices);
      const selectedScores = scores.gather(nmsIndices);
      const selectedClasses = classes.gather(nmsIndices);

      const boxesData = await selectedBoxes.array();
      const scoresData = await selectedScores.array();
      const classesData = await selectedClasses.array();

      tf.dispose([nmsIndices, selectedBoxes, selectedScores, selectedClasses]);

      return { boxesData, scoresData, classesData };
    }

    // Render Boxes
    function renderBoxes(boxesData, scoresData, classesData) {
      const ctx = elements.canvas.getContext('2d');
      ctx.clearRect(0, 0, ctx.canvas.width, ctx.canvas.height);

      // Calculate font size
      const fontSize = Math.max(
        Math.round(Math.max(ctx.canvas.width, ctx.canvas.height) / 40),
        14
      );
      ctx.font = `${fontSize}px Arial`;
      ctx.textBaseline = 'top';

      // Calculate scale factor for coordinates
      // Model outputs coords in 640×640 space, we need them in video space
      const video = elements.webcam;
      const maxSize = Math.max(video.videoWidth, video.videoHeight);
      const scaleFactor = maxSize / INPUT_SIZE;

      let visibleDetections = 0;

      for (let i = 0; i < scoresData.length; i++) {
        const classIndex = classesData[i];
        
        // Apply filter
        if (filterMode === 'four-leaf-only' && classIndex !== 1) {
          continue;
        }

        const className = CLASS_NAMES[classIndex];
        const color = colors.get(classIndex);
        const score = (scoresData[i] * 100).toFixed(1);

        let [y1, x1, y2, x2] = boxesData[i];
        
        // Scale from model space (640×640) to video space
        x1 *= scaleFactor;
        x2 *= scaleFactor;
        y1 *= scaleFactor;
        y2 *= scaleFactor;
        
        // Filter out boxes outside video bounds (in padding area)
        if (x1 >= video.videoWidth || y1 >= video.videoHeight) {
          continue;
        }
        
        // Clip boxes to video bounds
        x2 = Math.min(x2, video.videoWidth);
        y2 = Math.min(y2, video.videoHeight);
        
        const width = x2 - x1;
        const height = y2 - y1;
        
        // Skip invalid boxes
        if (width <= 0 || height <= 0) {
          continue;
        }

        visibleDetections++;

        // Draw box background
        ctx.fillStyle = Colors.hexToRgba(color, 0.2);
        ctx.fillRect(x1, y1, width, height);

        // Draw border
        ctx.strokeStyle = color;
        ctx.lineWidth = Math.max(Math.min(ctx.canvas.width, ctx.canvas.height) / 200, 2.5);
        ctx.strokeRect(x1, y1, width, height);

        // Draw label background
        ctx.fillStyle = color;
        const label = `${className} - ${score}%`;
        const textWidth = ctx.measureText(label).width;
        const textHeight = fontSize;
        const yText = y1 - (textHeight + ctx.lineWidth);
        
        ctx.fillRect(
          x1 - 1,
          yText < 0 ? 0 : yText,
          textWidth + ctx.lineWidth,
          textHeight + ctx.lineWidth
        );

        // Draw label text
        ctx.fillStyle = '#ffffff';
        ctx.fillText(label, x1 - 1, yText < 0 ? 0 : yText);
      }

      // Update detections count
      elements.detectionsDisplay.textContent = `${visibleDetections} detection${visibleDetections !== 1 ? 's' : ''}`;
    }

    // Sync Canvas Size with Video
    function syncCanvasSize() {
      const video = elements.webcam;
      const canvas = elements.canvas;
      
      // Only update if video size has changed (performance optimization)
      if (video.videoWidth !== lastVideoWidth || video.videoHeight !== lastVideoHeight) {
        // Set canvas size to match video's actual size
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        
        // Position canvas to match video's display size
        canvas.style.width = video.offsetWidth + 'px';
        canvas.style.height = video.offsetHeight + 'px';
        
        // Update tracking variables
        lastVideoWidth = video.videoWidth;
        lastVideoHeight = video.videoHeight;
      }
    }

    // Main Detection Loop
    async function detectFrame() {
      if (!isRunning) return;

      const startTime = performance.now();

      try {
        await tf.nextFrame();

        // Sync canvas size
        syncCanvasSize();

        const { input, xRatio, yRatio } = preprocessImage(elements.webcam);
        
        // Run inference
        const output = await model.executeAsync(input);
        
        // Post-process
        const { boxes, scores, classes } = await postProcess(output);
        
        // Apply NMS
        const { boxesData, scoresData, classesData } = await applyNMS(boxes, scores, classes);
        
        // Render
        renderBoxes(boxesData, scoresData, classesData);
        
        // Cleanup
        tf.dispose([input, output, boxes, scores, classes]);

        // Update FPS
        frameCount++;
        const currentTime = performance.now();
        if (currentTime - lastTime >= 1000) {
          fps = Math.round((frameCount * 1000) / (currentTime - lastTime));
          elements.fpsDisplay.textContent = `${fps} FPS`;
          frameCount = 0;
          lastTime = currentTime;
        }

      } catch (error) {
        console.error('Detection error:', error);
      }

      // Continue loop
      animationId = requestAnimationFrame(detectFrame);
    }

    // Event Listeners
    elements.startButton.addEventListener('click', startCamera);
    elements.switchCamera.addEventListener('click', switchCamera);
    elements.filterToggle.addEventListener('click', toggleFilter);

    // Handle window resize
    window.addEventListener('resize', syncCanvasSize);

    // Mobile overlay event listeners
    window.addEventListener('orientationchange', () => MobileOverlay.handleOrientationChange());
    window.addEventListener('resize', () => MobileOverlay.handleResize());

    // Initialize
    loadModel();
  </script>
</body>
</html>
